version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wordflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordflow
      POSTGRES_PASSWORD: wordflow
      POSTGRES_DB: wordflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wordflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wordflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api.dev
    container_name: wordflow-api
    environment:
      NODE_ENV: development
      PORT: 3002
      API_VERSION: v1
      DATABASE_URL: postgresql://wordflow:wordflow@postgres:5432/wordflow?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: wordflow-uploads
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      GITHUB_CLIENT_ID: Ov23liZbydGXIQoIdKPP
      GITHUB_CLIENT_SECRET: 4de853315780942a0853bb6403204aeb0d33e0cd
      GITHUB_CALLBACK_URL: http://localhost:3002/api/v1/auth/github/callback
      AI_API_BASE_URL: https://api.stepfun.com/step_plan/v1
      AI_API_KEY: 4ht7XMQIza75P819zfna8rCZEnCegevBfA5zfbiqMU1iUYInE9Jd1GLFAXbSllYn3
      AI_MODEL: step-3.7-flash
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      BILIBILI_COOKIE: ${BILIBILI_COOKIE}
    ports:
      - "3002:3002"
    volumes:
      - ./src/server/src:/app/src
      - ./src/server/prisma:/app/prisma
      - wordflow_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  wordflow_node_modules:
