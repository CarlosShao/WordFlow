# WordFlow Nginx Configuration
# Production reverse proxy for WordFlow application
#
# Usage: Copy to /etc/nginx/sites-available/wordflow and symlink to sites-enabled
# Test: nginx -t
# Reload: nginx -s reload

# -- Upstream Definitions ---
upstream wordflow_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# -- Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# -- Server Block : Port 80 ---
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Accept any server name; replace with domain in production

    # --- Client Body Size (supports file uploads up to 10MB) ---
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is enabled after SSL is configured (see deploy/README.md)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Logging ---
    access_log /var/log/nginx/wordflow_access.log;
    error_log /var/log/nginx/wordflow_error.log warn;

    # -- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ============================================================
    # API Reverse Proxy : /api/
    # ============================================================
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://wordflow_api;
        proxy_http_version 1.1;

        # --- Standard Proxy Headers ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- WebSocket Support ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Timeouts ---
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # --- Buffering ---
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 8k;

        # --- Error Handling ---
        proxy_intercept_errors on;
        error_page 502 503 504 /502.html;
    }

    # ============================================================
    # Auth Endpoints : Stricter rate limiting
    # ============================================================
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://wordflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # Frontend Static Files : /
    # ============================================================
    location / {
        root /var/www/wordflow/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # --- Static Asset Cache Strategy ---
        # Long-cache for hashed assets (Vite generates content-hashed filenames)
        location ~* \.(js|css|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Medium-cache for images and media
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|webm)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # No-cache for HTML (always fresh)
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # ============================================================
    # Health Check Endpoint (bypass logging)
    # ============================================================
    location /health {
        proxy_pass http://wordflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================================================
    # Error Pages
    # ============================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /502.html;

    location = /502.html {
        root /var/www/wordflow/dist;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
